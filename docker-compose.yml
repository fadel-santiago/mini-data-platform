services:
  warehouse:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pme_warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-pme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pme_demo}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  orchestrator:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: warehouse
      DBT_PROFILES_DIR: /app
      DATA_DIR: /app/data/sources
      DAGSTER_HOME: /app/.dagster
    ports:
      - "127.0.0.1:${DAGSTER_HOST_PORT:-3000}:3000"
    volumes:
      - .:/app
      - dagster_data:/app/.dagster
    depends_on:
      warehouse:
        condition: service_healthy
    command: dagster dev -h 0.0.0.0 -p 3000 -f orchestration/definitions.py

  dashboard:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: warehouse
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-8501}:8501"
    volumes:
      - .:/app
    depends_on:
      warehouse:
        condition: service_healthy
    command: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501

volumes:
  postgres_data:
  dagster_data:

